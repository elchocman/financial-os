app = "financial-os-backend"
primary_region = "scl"   # Santiago, Chile — closest to your data

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines = true
  auto_start_machines = true

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"

[env]
  PORT = "8000"
